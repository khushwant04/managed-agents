{{- if not .Values.secrets.existingSecret -}}
{{- $s := .Values.secrets -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "managed-agents.secretName" . }}
  labels:
    {{- include "managed-agents.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ include "managed-agents.databaseUrl" . | quote }}
  AGENTS_MASTER_KEY: {{ required "secrets.masterKey is required" $s.masterKey | quote }}
  {{- with $s.anthropicApiKey }}
  ANTHROPIC_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with $s.openaiApiKey }}
  OPENAI_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with $s.e2bApiKey }}
  E2B_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with $s.awsAccessKeyId }}
  AWS_ACCESS_KEY_ID: {{ . | quote }}
  {{- end }}
  {{- with $s.awsSecretAccessKey }}
  AWS_SECRET_ACCESS_KEY: {{ . | quote }}
  {{- end }}
  {{- with $s.bootstrapKey }}
  AGENTS_BOOTSTRAP_KEY: {{ . | quote }}
  {{- end }}
  {{- range $k, $v := $s.extra }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
