{{- $c := dict "root" . "component" "gateway" -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "managed-agents.componentName" $c }}
  labels:
    {{- include "managed-agents.componentLabels" $c | nindent 4 }}
  {{- with .Values.gateway.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.gateway.service.type }}
  ports:
    - name: http
      port: {{ .Values.gateway.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "managed-agents.componentSelectorLabels" $c | nindent 4 }}
