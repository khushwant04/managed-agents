{{- if .Values.migrations.enabled -}}
{{- $c := dict "root" . "component" "migrate" -}}
{{- $m := .Values.migrations -}}
{{- /*
Hooks run before regular resources exist, so the Job cannot rely on the
release's Secret on first install. Without existingSecret it gets its own
short-lived hook Secret holding only DATABASE_URL.

With the bundled Postgres the database does not exist before install, so the
Job runs post-install instead of pre-install (still pre-upgrade).
*/ -}}
{{- $hook := ternary "post-install,pre-upgrade" "pre-install,pre-upgrade" .Values.postgresql.enabled -}}
{{- $secretName := ternary .Values.secrets.existingSecret (include "runhive.componentName" $c) (ne .Values.secrets.existingSecret "") -}}
{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "runhive.componentLabels" $c | nindent 4 }}
  annotations:
    helm.sh/hook: {{ $hook }}
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
type: Opaque
stringData:
  DATABASE_URL: {{ include "runhive.databaseUrl" . | quote }}
---
{{- end }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "runhive.componentName" $c }}
  labels:
    {{- include "runhive.componentLabels" $c | nindent 4 }}
  annotations:
    helm.sh/hook: {{ $hook }}
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: {{ $m.backoffLimit }}
  activeDeadlineSeconds: {{ $m.activeDeadlineSeconds }}
  ttlSecondsAfterFinished: {{ $m.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "runhive.componentLabels" $c | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      # The release ServiceAccount may not exist yet on first install.
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: migrate
          image: {{ include "runhive.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["migrate"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: DATABASE_URL
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml $m.resources | nindent 12 }}
          volumeMounts:
            {{- include "runhive.volumeMounts" . | nindent 12 }}
      volumes:
        {{- include "runhive.volumes" . | nindent 8 }}
{{- end }}
