{{- if .Values.gateway.autoscaling.enabled -}}
{{- $c := dict "root" . "component" "gateway" -}}
{{- $a := .Values.gateway.autoscaling -}}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "runhive.componentName" $c }}
  labels:
    {{- include "runhive.componentLabels" $c | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "runhive.componentName" $c }}
  minReplicas: {{ $a.minReplicas }}
  maxReplicas: {{ $a.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $a.targetCPUUtilizationPercentage }}
{{- end }}
