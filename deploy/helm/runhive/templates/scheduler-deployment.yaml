{{- $c := dict "root" . "component" "scheduler" -}}
{{- $v := .Values.scheduler -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "runhive.componentName" $c }}
  labels:
    {{- include "runhive.componentLabels" $c | nindent 4 }}
spec:
  # One scheduler; Recreate avoids two overlapping during rollouts (it also
  # takes Postgres advisory locks, so an overlap would be safe, just wasteful).
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "runhive.componentSelectorLabels" $c | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "runhive.componentLabels" $c | nindent 8 }}
        {{- with $v.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        {{- include "runhive.podAnnotations" (dict "root" . "values" $v) | nindent 8 }}
    spec:
      {{- include "runhive.podCommon" (dict "root" . "values" $v) | nindent 6 }}
      containers:
        - name: scheduler
          image: {{ include "runhive.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["scheduler"]
          envFrom:
            {{- include "runhive.envFrom" . | nindent 12 }}
          env:
            {{- include "runhive.secretEnv" . | nindent 12 }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml $v.resources | nindent 12 }}
          volumeMounts:
            {{- include "runhive.volumeMounts" . | nindent 12 }}
