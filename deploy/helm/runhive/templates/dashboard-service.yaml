{{- if .Values.dashboard.enabled -}}
{{- $c := dict "root" . "component" "dashboard" -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "runhive.componentName" $c }}
  labels:
    {{- include "runhive.componentLabels" $c | nindent 4 }}
  {{- with .Values.dashboard.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.dashboard.service.type }}
  ports:
    - name: http
      port: {{ .Values.dashboard.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "runhive.componentSelectorLabels" $c | nindent 4 }}
{{- end }}
