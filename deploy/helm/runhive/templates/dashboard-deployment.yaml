{{- if .Values.dashboard.enabled -}}
{{- $c := dict "root" . "component" "dashboard" -}}
{{- $v := .Values.dashboard -}}
{{- $gw := include "runhive.componentName" (dict "root" . "component" "gateway") -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "runhive.componentName" $c }}
  labels:
    {{- include "runhive.componentLabels" $c | nindent 4 }}
spec:
  replicas: {{ $v.replicaCount }}
  selector:
    matchLabels:
      {{- include "runhive.componentSelectorLabels" $c | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "runhive.componentLabels" $c | nindent 8 }}
        {{- with $v.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with $v.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "runhive.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $v.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $v.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $v.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $v.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: dashboard
          image: {{ printf "%s:%s" $v.image.repository (default .Chart.AppVersion $v.image.tag) }}
          imagePullPolicy: {{ $v.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ $v.port }}
              protocol: TCP
          env:
            - name: PORT
              value: {{ $v.port | quote }}
            # The dashboard calls the API server-side; the browser only talks to the dashboard.
            - name: RUNHIVE_API_URL
              value: {{ printf "http://%s:%v" $gw .Values.gateway.service.port | quote }}
            {{- with $v.apiUrlAllowlist }}
            - name: RUNHIVE_API_URL_ALLOWLIST
              value: {{ join "," . | quote }}
            {{- end }}
            {{- with $v.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with $v.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $v.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml $v.resources | nindent 12 }}
          volumeMounts:
            # Writable paths under the read-only root filesystem.
            - name: tmp
              mountPath: /tmp
            - name: next-cache
              mountPath: /app/.next/cache
      volumes:
        - name: tmp
          emptyDir: {}
        - name: next-cache
          emptyDir: {}
{{- end }}
