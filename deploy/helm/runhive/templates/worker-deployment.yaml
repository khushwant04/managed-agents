{{- $c := dict "root" . "component" "worker" -}}
{{- $v := .Values.worker -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "runhive.componentName" $c }}
  labels:
    {{- include "runhive.componentLabels" $c | nindent 4 }}
spec:
  {{- if not .Values.keda.enabled }}
  replicas: {{ $v.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "runhive.componentSelectorLabels" $c | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "runhive.componentLabels" $c | nindent 8 }}
        {{- with $v.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        {{- include "runhive.podAnnotations" (dict "root" . "values" $v) | nindent 8 }}
        {{- if $v.metrics.enabled }}
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ $v.metrics.port | quote }}
        prometheus.io/path: /metrics
        {{- end }}
    spec:
      {{- include "runhive.podCommon" (dict "root" . "values" $v) | nindent 6 }}
      terminationGracePeriodSeconds: {{ $v.terminationGracePeriodSeconds }}
      containers:
        - name: worker
          image: {{ include "runhive.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["worker"]
          envFrom:
            {{- include "runhive.envFrom" . | nindent 12 }}
          env:
            {{- include "runhive.secretEnv" . | nindent 12 }}
            # Stable, readable worker ids in run leases.
            - name: RUNHIVE_WORKER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # Workers serve Prometheus metrics on this port (0 disables it).
            - name: RUNHIVE_METRICS_PORT
              value: {{ ternary $v.metrics.port 0 $v.metrics.enabled | quote }}
          {{- if $v.metrics.enabled }}
          ports:
            - name: metrics
              containerPort: {{ $v.metrics.port }}
              protocol: TCP
          {{- end }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml $v.resources | nindent 12 }}
          volumeMounts:
            {{- include "runhive.volumeMounts" . | nindent 12 }}
