apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: runhive
  labels:
    helm.sh/chart: runhive-0.1.0
    app.kubernetes.io/name: runhive
    app.kubernetes.io/instance: runhive
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: runhive
    app.kubernetes.io/component: gateway
  annotations:
    # SSE / WebSocket: keep long-lived streams open and flush events immediately.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/proxy-body-size: "64m"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - "runhive.example.com"
        - "console.runhive.example.com"
      secretName: runhive-tls
  rules:
    - host: "runhive.example.com"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: runhive-gateway
                port:
                  name: http
    - host: "console.runhive.example.com"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: runhive-dashboard
                port:
                  name: http
