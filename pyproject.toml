[project]
name = "managed-agents-workspace"
version = "0.0.0"
requires-python = ">=3.11"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
managed-agents = { workspace = true }
managed-agents-server = { workspace = true }
managed-agents-cli = { workspace = true }

[dependency-groups]
dev = [
  "managed-agents",
  "managed-agents-server",
  "managed-agents-cli",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["packages/agents/tests", "packages/agents-server/tests", "packages/agents-cli/tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501", "ASYNC109"]

[tool.ruff.lint.isort]
known-first-party = ["agents", "agents_server", "agents_cli"]
