[project]
name = "runhive-workspace"
version = "0.0.0"
requires-python = ">=3.11"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
runhive = { workspace = true }
runhive-server = { workspace = true }
runhive-cli = { workspace = true }

[dependency-groups]
dev = [
  "runhive",
  "runhive-server",
  "runhive-cli",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "opentelemetry-sdk>=1.27",
  "e2b>=2.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["packages/runhive/tests", "packages/runhive-server/tests", "packages/runhive-cli/tests", "examples"]
markers = ["live: calls real model APIs (needs ANTHROPIC_API_KEY / OPENAI_API_KEY)"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501", "ASYNC109"]

[tool.ruff.lint.isort]
known-first-party = ["runhive", "runhive_server", "runhive_cli"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["ASYNC110", "ASYNC230", "ASYNC251"]
"examples/**" = ["ASYNC230", "ASYNC240"]
