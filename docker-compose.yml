# Local stack: Postgres, MinIO, migrations, gateway, worker(s), scheduler and dashboard.
#
#   cp deploy/compose/.env.example .env      # optional: provider keys, overrides
#   docker compose up --build                # or: make dev
#   docker compose up --scale worker=3       # more workers
#
#   API:       http://localhost:8080   (admin key: $RUNHIVE_BOOTSTRAP_KEY, default ak_dev_admin)
#   Dashboard: http://localhost:3000   (sign in with the same key)
#   MinIO:     http://localhost:9001   (console; minioadmin / minioadmin)
#
# Sandboxes
#   The default sandbox provider is E2B (RUNHIVE_SANDBOX_PROVIDER=e2b, needs E2B_API_KEY).
#   For Docker sandboxes on this machine instead, layer the override file, which
#   switches the provider, builds the worker with the docker CLI and mounts the
#   host's Docker socket into the worker only:
#
#     make sandbox-image                      # builds runhive-base:latest
#     DOCKER_GID=$(stat -c %g /var/run/docker.sock) \
#       docker compose -f docker-compose.yml -f deploy/compose/docker-sandbox.yml up --build
#
#   Mounting the Docker socket gives the worker root-equivalent access to the
#   host. Development only.
#
# Everything marked DEV ONLY must be replaced outside a laptop.

name: runhive

x-runhive-env: &runhive-env
  DATABASE_URL: postgresql://agents:agents@postgres:5432/agents
  RUNHIVE_PUBLIC_URL: ${RUNHIVE_PUBLIC_URL:-http://localhost:8080}
  RUNHIVE_BLOB_URL: s3://agents/
  AWS_ENDPOINT_URL: http://minio:9000
  AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
  AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
  AWS_DEFAULT_REGION: us-east-1
  # DEV ONLY default: a fixed, public key. Generate a real one with
  #   python -c "import os, base64; print(base64.b64encode(os.urandom(32)).decode())"
  RUNHIVE_MASTER_KEY: ${RUNHIVE_MASTER_KEY:-ZGV2LW9ubHktbWFzdGVyLWtleS1OT1QtU0VDUkVUISE=}
  RUNHIVE_SANDBOX_PROVIDER: ${RUNHIVE_SANDBOX_PROVIDER:-e2b}
  RUNHIVE_WORKER_CONCURRENCY: ${RUNHIVE_WORKER_CONCURRENCY:-8}
  RUNHIVE_LEASE_SECONDS: ${RUNHIVE_LEASE_SECONDS:-30}
  RUNHIVE_IDLE_PAUSE_SECONDS: ${RUNHIVE_IDLE_PAUSE_SECONDS:-300}
  RUNHIVE_RATE_LIMIT_PER_MINUTE: ${RUNHIVE_RATE_LIMIT_PER_MINUTE:-600}
  # Provider keys, passed through from your shell or .env (empty if unset).
  E2B_API_KEY: ${E2B_API_KEY:-}
  # A self-hosted E2B runtime (E2B Embed, https://github.com/e2b-dev/runtime);
  # empty means E2B Cloud. On Embed: http://<host>:3000 and http://<host>:3002.
  E2B_API_URL: ${E2B_API_URL:-}
  E2B_SANDBOX_URL: ${E2B_SANDBOX_URL:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}

x-runhive-service: &runhive-service
  image: ${RUNHIVE_IMAGE:-runhive-server:dev}
  build:
    context: .
    dockerfile: Dockerfile
  environment: *runhive-env
  restart: unless-stopped
  init: true

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: agents
      POSTGRES_PASSWORD: agents # DEV ONLY
      POSTGRES_DB: agents
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agents -d agents"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # MinIO stopped publishing official minio/minio and minio/mc images; the
  # defaults are the community-maintained pgsty builds. Override with
  # MINIO_IMAGE / MC_IMAGE (any S3-compatible server works for RUNHIVE_BLOB_URL).
  minio:
    image: ${MINIO_IMAGE:-pgsty/minio:RELEASE.2026-08-04T00-00-00Z}
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin} # DEV ONLY
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin} # DEV ONLY
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  minio-init:
    image: ${MC_IMAGE:-pgsty/mc:RELEASE.2026-09-16T00-00-00Z}
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing local/agents
    restart: "no"

  migrate:
    <<: *runhive-service
    command: ["migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      disable: true
    restart: "no"

  gateway:
    <<: *runhive-service
    command: ["serve", "--host", "0.0.0.0", "--port", "8080"]
    environment:
      <<: *runhive-env
      # DEV ONLY: creates org/project "default" with this admin key at startup.
      # Set only on the gateway so services don't race to create the same org.
      RUNHIVE_BOOTSTRAP_KEY: ${RUNHIVE_BOOTSTRAP_KEY:-ak_dev_admin}
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully

  worker:
    <<: *runhive-service
    command: ["worker"]
    # No published ports or container_name, so `--scale worker=N` works.
    healthcheck:
      disable: true
    stop_grace_period: 60s
    depends_on:
      gateway:
        condition: service_healthy

  scheduler:
    <<: *runhive-service
    command: ["scheduler"]
    healthcheck:
      disable: true
    depends_on:
      gateway:
        condition: service_healthy

  dashboard:
    # Next.js console. Proxies to the gateway; the API key stays in an httpOnly cookie.
    image: ${RUNHIVE_DASHBOARD_IMAGE:-runhive-dashboard:dev}
    build:
      context: ./dashboard
    environment:
      RUNHIVE_API_URL: http://gateway:8080
    ports:
      - "${DASHBOARD_PORT:-3000}:3000"
    depends_on:
      gateway:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  minio-data:
