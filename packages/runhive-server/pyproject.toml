[project]
name = "runhive-server"
version = "0.1.0"
description = "Gateway, registry, router, scheduler and runtime workers for Runhive."
requires-python = ">=3.11"
authors = [{ name = "Khushwant Sanwalot" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["agents", "llm", "claude", "openai", "e2b", "sandbox", "durable-execution"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
  "runhive",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "asyncpg>=0.29",
  "cryptography>=43",
  "croniter>=3.0",
  "prometheus-client>=0.20",
  "opentelemetry-api>=1.27",
  "httpx>=0.27",
]

[project.optional-dependencies]
s3 = ["boto3>=1.34"]
otel = ["opentelemetry-sdk>=1.27", "opentelemetry-exporter-otlp-proto-http>=1.27"]

[project.scripts]
runhive-server = "runhive_server.__main__:main"

[project.urls]
Homepage = "https://github.com/khushwant04/managed-agents"
Documentation = "https://github.com/khushwant04/managed-agents/tree/main/docs"
Repository = "https://github.com/khushwant04/managed-agents"
Issues = "https://github.com/khushwant04/managed-agents/issues"
Changelog = "https://github.com/khushwant04/managed-agents/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/runhive_server"]
