[project]
name = "runhive"
version = "0.1.0.dev0"
description = "Define, run and deploy agents on your own harness, against Claude or OpenAI models."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Khushwant Sanwalot" }]
dependencies = [
  "pydantic>=2.8",
  "httpx>=0.27",
  "anthropic>=1.13",
  "openai>=3.31",
  "jsonschema>=4.23",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
e2b = ["e2b>=2.0"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/runhive"]
