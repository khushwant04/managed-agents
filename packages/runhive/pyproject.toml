[project]
name = "runhive"
version = "0.1.0"
description = "Define, run and deploy agents on your own harness, against Claude or OpenAI models."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Khushwant Sanwalot" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["agents", "llm", "claude", "openai", "e2b", "sandbox", "durable-execution"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
  "pydantic>=2.8",
  "httpx>=0.27",
  "anthropic>=1.13",
  "openai>=3.31",
  "jsonschema>=4.23",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
e2b = ["e2b>=2.0"]

[project.urls]
Homepage = "https://github.com/khushwant04/managed-agents"
Documentation = "https://github.com/khushwant04/managed-agents/tree/main/docs"
Repository = "https://github.com/khushwant04/managed-agents"
Issues = "https://github.com/khushwant04/managed-agents/issues"
Changelog = "https://github.com/khushwant04/managed-agents/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/runhive"]
