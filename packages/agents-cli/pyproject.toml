[project]
name = "managed-agents-cli"
version = "0.1.0.dev0"
description = "The `agents` command line: dev, apply, deploy, promote, sessions tail."
requires-python = ">=3.11"
authors = [{ name = "Khushwant Sanwalot" }]
dependencies = ["managed-agents", "managed-agents-server"]

[project.scripts]
agents = "agents_cli.main:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agents_cli"]
