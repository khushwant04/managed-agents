[project]
name = "managed-agents-server"
version = "0.1.0.dev0"
description = "Gateway, registry, router, scheduler and runtime workers for managed agents."
requires-python = ">=3.11"
authors = [{ name = "Khushwant Sanwalot" }]
dependencies = [
  "managed-agents",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "asyncpg>=0.29",
  "cryptography>=43",
  "croniter>=3.0",
  "prometheus-client>=0.20",
  "opentelemetry-api>=1.27",
]

[project.scripts]
agents-server = "agents_server.__main__:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agents_server"]
