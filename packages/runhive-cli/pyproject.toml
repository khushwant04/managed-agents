[project]
name = "runhive-cli"
version = "0.1.0"
description = "The `runhive` command line: dev, apply, deploy, promote, sessions tail."
requires-python = ">=3.11"
authors = [{ name = "Khushwant Sanwalot" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["agents", "llm", "claude", "openai", "e2b", "sandbox", "durable-execution"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = ["runhive", "runhive-server"]

[project.scripts]
runhive = "runhive_cli.main:main"

[project.urls]
Homepage = "https://github.com/khushwant04/managed-agents"
Documentation = "https://github.com/khushwant04/managed-agents/tree/main/docs"
Repository = "https://github.com/khushwant04/managed-agents"
Issues = "https://github.com/khushwant04/managed-agents/issues"
Changelog = "https://github.com/khushwant04/managed-agents/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/runhive_cli"]
