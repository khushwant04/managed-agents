name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_VERSION: "0.11.32"
  FORCE_COLOR: "1"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          python-version: "3.12"
      - name: Install (fails if uv.lock is out of date)
        run: uv sync --locked
      - name: Ruff
        run: uv run ruff check --output-format=github .

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Server tests create a throwaway database per test on this server.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: uv sync --locked
      - name: Pytest (recorded responses; live tests excluded)
        run: >-
          uv run pytest -q -m "not live"
          --cov=agents.runtime
          --cov-report=term-missing
          --cov-report=xml
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-py${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore

  docker:
    name: Docker images (build only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Server image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: managed-agents-server:ci
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server
      - name: Sandbox image (agents-base)
        uses: docker/build-push-action@v6
        with:
          context: infra/e2b
          push: false
          tags: agents-base:ci
          cache-from: type=gha,scope=sandbox
          cache-to: type=gha,mode=max,scope=sandbox
      - name: Dashboard image
        uses: docker/build-push-action@v6
        with:
          context: dashboard
          push: false
          tags: managed-agents-dashboard:ci
          cache-from: type=gha,scope=dashboard
          cache-to: type=gha,mode=max,scope=dashboard
      - name: Compose file is valid
        run: docker compose config --quiet

  helm:
    name: Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.2
      - name: Lint and render
        working-directory: deploy/helm/managed-agents
        run: |
          # Docker Hub (Bitnami's OCI registry) rate-limits anonymous pulls; retry.
          for i in 1 2 3; do helm dependency build . && break; sleep $((i * 20)); done
          test -n "$(ls charts/postgresql-*.tgz 2>/dev/null)"
          for f in ci/*.yaml; do
            echo "::group::$f"
            helm lint --strict . -f "$f"
            helm template ci . -f "$f" > /dev/null
            echo "::endgroup::"
          done

  openapi:
    name: OpenAPI spec is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --locked
      - name: Regenerate and diff
        run: |
          uv run agents-server openapi > /tmp/openapi.json
          diff -u docs/api/openapi.json /tmp/openapi.json || { echo "::error::docs/api/openapi.json is stale; run make openapi"; exit 1; }

  typescript:
    name: TypeScript SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - run: npm ci
      - name: Generated types match the spec
        run: npm run check:generated --workspace @managed-agents/client
      - run: npm run build
      - run: npx tsc --noEmit
      - run: npm test

  dashboard:
    name: Dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - name: Generated types match the spec
        run: |
          npm run generate
          git diff --exit-code -- lib/api-types.ts || { echo "::error::dashboard/lib/api-types.ts is stale; run npm run generate"; exit 1; }
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
